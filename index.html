<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل ضمان وصيانة الأجهزة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1b1f29; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0f4c81; --accent-soft:#e8f0f8; --chip:#f1f5f9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:var(--accent);color:#fff;padding:28px 18px 70px;text-align:center}
header h1{font-size:1.6rem;font-weight:800}
header p{opacity:.85;font-size:.95rem}
.wrap{max-width:820px;margin:-48px auto 40px;padding:0 14px}
.search{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:1rem;outline:none}
.search input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.card summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
.card summary::-webkit-details-marker{display:none}
.logo{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:0 0 auto;direction:ltr}
.t{flex:1;min-width:0}
.t h2{font-size:1.15rem;font-weight:700}
.t span{color:var(--muted);font-size:.88rem}
.arrow{color:var(--muted);transition:transform .2s}
details[open] .arrow{transform:rotate(180deg)}
.body{padding:0 18px 18px;border-top:1px solid var(--line)}
.sec{margin-top:14px}
.sec h3{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.badge{display:inline-block;background:#fff4e5;color:#9a5b00;border-radius:8px;padding:2px 10px;font-size:.88rem;font-weight:600}
.phones{display:flex;flex-wrap:wrap;gap:8px}
.ph{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:10px;padding:7px 12px;text-decoration:none;color:var(--ink);font-weight:600;direction:ltr;font-size:.98rem}
.ph small{color:var(--muted);font-weight:400;font-size:.78rem;direction:rtl}
.ph svg{width:15px;height:15px;color:var(--accent)}
.loc{padding:10px 0;border-bottom:1px dashed var(--line)}
.loc:last-child{border-bottom:none}
.loc b{display:block}
.loc .addr{color:#374151;font-size:.95rem}
.loc .phones{margin-top:6px}
ul.notes{padding-right:18px;font-size:.92rem;color:#374151}
.empty{text-align:center;color:var(--muted);padding:30px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{aspect-ratio:1/1;background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.lg{width:100%;flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.lg img{position:absolute;inset:0;margin:auto;max-width:88%;max-height:100%;object-fit:contain}
.wm{font-weight:800;font-size:1.7rem;direction:ltr;letter-spacing:.5px;text-align:center;line-height:1.1}
.wm small{display:block;font-size:.75rem;letter-spacing:2px;font-weight:600;opacity:.8}
.tn{font-weight:700;font-size:1rem}
.tn span{display:block;color:var(--muted);font-weight:400;font-size:.78rem;line-height:1.3}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:6px 18px 26px}
.sh-top{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.sh-top .mini{width:60px;height:60px;border-radius:12px;background:#f8fafc;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.sh-top .mini img{max-width:90%;max-height:90%}
.sh-top .mini .wm{font-size:.85rem}
.sh-top h2{font-size:1.2rem;flex:1}
.sh-top h2 span{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.x{border:none;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <h1>دليل ضمان وصيانة الأجهزة</h1>
  <p>أرقام وعناوين مراكز الصيانة المعتمدة لكل شركة</p>
</header>
<div class="wrap">
  <div class="search"><input id="q" type="search" placeholder="ابحث باسم الشركة أو المحافظة..."></div>
    <div id="list" class="grid"></div>
</div>
<footer>اضغط على أي شركة لعرض التفاصيل</footer>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

const fmt=n=>n.length===11?n.replace(/(\d{4})(\d{3})(\d{4})/,'$1 $2 $3'):n;
const phs=a=>'<div class="phones">'+a.map(([n,l])=>`<a class="ph" href="tel:${n}">${icon}${fmt(n)}${l?` <small>${l}</small>`:''}</a>`).join('')+'</div>';


const logoHTML=d=>d.logo?`<img src="${d.logo}" alt="${d.en}">`:`<div class="wm" style="color:${d.col};${d.bg?`background:${d.bg};padding:6px 10px;border-radius:8px`:''}">${d.wm}</div>`;
function detail(d){return `
  ${d.warranty?`<div class="sec"><h3>مدة الضمان</h3><span class="badge">${d.warranty}</span></div>`:''}
  ${d.phones.length?`<div class="sec"><h3>أرقام التواصل</h3>${phs(d.phones)}</div>`:''}
  ${d.locs.length?`<div class="sec"><h3>${d.locs.length>1?'مراكز الصيانة':'العنوان'}</h3>${d.locs.map(l=>`<div class="loc"><b>📍 ${l.city}</b>${l.addr?`<div class="addr">${l.addr}</div>`:''}${l.phones?phs(l.phones):''}</div>`).join('')}</div>`:''}
  ${d.notes?`<div class="sec"><h3>ملاحظات</h3><ul class="notes">${d.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`:''}`}
const ov=document.getElementById('ov'),sheet=document.getElementById('sheet');
function openD(i){const d=D[i];
  sheet.innerHTML=`<div class="sh-top"><div class="mini">${logoHTML(d)}</div><h2>${d.brand}${d.agent?`<span>${d.agent}</span>`:''}</h2><button class="x" onclick="closeD()">✕</button></div>${detail(d)}`;
  ov.classList.add('show');sheet.scrollTop=0;}
function closeD(){ov.classList.remove('show')}
ov.addEventListener('click',e=>{if(e.target===ov)closeD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const items=D.map((d,i)=>[d,i]).filter(([d])=>!q||JSON.stringify({...d,logo:''}).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=items.length?items.map(([d,i])=>`
   <button class="tile" onclick="openD(${i})"><div class="lg">${logoHTML(d)}</div><div class="tn">${d.brand}</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">مفيش نتائج</div>';
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body>
</html>
